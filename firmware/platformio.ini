; EL15 Load Control — standalone firmware.
;
; TWO board targets share this codebase (see src/board_config.h):
;
;   esp32-c6-amoled  Waveshare ESP32-C6-Touch-AMOLED-1.8 — 368x448 QSPI AMOLED,
;                    no PSRAM, bit-banged software-SPI SD. This is the
;                    HARDWARE-VERIFIED target: every bench result in HANDOVER.md
;                    came from this board.
;   esp32-s3-lcd35   Waveshare ESP32-S3-Touch-LCD-3.5 — 320x480 ST7796 SPI IPS,
;                    8 MB PSRAM, hardware SDMMC. NOT yet verified on hardware.
;                    (The "-C" SKU is this board bundled with an OV5640 camera.)
;
; Build one with `pio run -e <env>`; `pio run` builds both.
;
; Both use the community pioarduino platform fork rather than mainline
; "espressif32": the C6 needs arduino-esp32 3.x (IDF 5.1+) which mainline does
; not ship, and running ONE platform across both targets keeps the two images on
; the same core/library versions.

[platformio]
; The S3 board is the one being transitioned to, so it builds first — but the C6
; is still the verified reference. Neither is removed.
default_envs = esp32-s3-lcd35, esp32-c6-amoled

; ---------------------------------------------------------------------------
; Shared across both boards
; ---------------------------------------------------------------------------
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = qio
board_build.f_flash = 80000000L
; The redesigned UI adds large fonts + lv_chart and overflows the default
; ~1.3 MB app slot. Both boards have 16 MB flash, so use the 3 MB single-app
; table.
board_build.partitions = huge_app.csv

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; FATFS runs on the caller's stack (CONFIG_FATFS_LFN_STACK: a 255-char long
    ; filename buffer plus the FS work area), and every SD write happens on the
    ; Arduino loop task. 8 KB is the default and too tight for that on top of
    ; LVGL event handlers.
    -D ARDUINO_LOOP_STACK_SIZE=12288
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-missing-field-initializers
build_unflags =
    -std=gnu++11

; Pinned EXACTLY to the versions the hardware-verified image was built and
; bench-tested against (QA_GUIDE §1). Caret ranges here once let a clean
; checkout resolve newer libraries than any image that ever touched the real
; EL15 — bump these deliberately, re-verify on hardware, then update QA_GUIDE.
lib_deps =
    lvgl/lvgl @ 8.4.0
    moononournation/GFX Library for Arduino @ 1.6.7
    h2zero/NimBLE-Arduino @ 2.5.0
    greiman/SdFat @ 2.3.1

; ---------------------------------------------------------------------------
; Waveshare ESP32-C6-Touch-AMOLED-1.8  (hardware-verified reference target)
; ---------------------------------------------------------------------------
[env:esp32-c6-amoled]
board = esp32-c6-devkitc-1
; sd_card.cpp includes SdFat and SD_MMC in opposite arms of a #if, but
; PlatformIO's dependency finder scans #include lines WITHOUT evaluating the
; preprocessor — so without this, every build links both storage stacks. On the
; C6 that means linking SD_MMC, a driver for an SDIO host this chip does not
; physically have, which also emits a #warning on every build (noise that would
; eventually hide a real one).
lib_ignore = SD_MMC
; This board has NO PSRAM — Waveshare's spec lists only the C6's on-chip
; 512 KB HP SRAM (~320 KB usable from Arduino) plus 16 MB flash. That is why
; display.cpp uses a 1/7-frame (64-line) partial LVGL buffer in
; MALLOC_CAP_INTERNAL instead of a full 322 KB framebuffer — sized so NimBLE
; keeps the contiguous heap it needs to connect. Do NOT define BOARD_HAS_PSRAM
; here: it advertises memory that does not exist, so any ps_malloc() would hand
; back null. memory_type stays qio_qspi (it selects the prebuilt lib variant
; that exists for the C6; qio_opi points at a nonexistent variant dir).
board_build.arduino.memory_type = qio_qspi
build_flags =
    ${env.build_flags}
    -D BOARD_C6_AMOLED
    ; The C6 has ONE general-purpose SPI host and the AMOLED owns it, so the SD
    ; card runs on bit-banged (software) SPI on its own pins — the IDF sdspi
    ; driver cannot share the panel's bus (card init fails at CMD59). We supply
    ; our own SdSpiBaseClass driver (sd_card.cpp) built on plain
    ; digitalWrite/Read for reliable, slow-enough timing; SPI_DRIVER_SELECT=3
    ; selects it. (SdFat's built-in SoftSpiDriver uses fast register GPIO that
    ; was too fast to write reliably on this card.)
    -D SPI_DRIVER_SELECT=3
    ; Compute a real CRC7 for every command (+ CRC16 on data). Without this,
    ; SdFat sends a fixed 0x87 CRC byte for all commands, which a card with CRC
    ; checking enabled rejects (ACMD41 -> R1 0x08, CRC error). Correct CRCs also
    ; catch the occasional bit error on the bit-banged link instead of trusting
    ; it.
    -D USE_SD_CRC=1

; ---------------------------------------------------------------------------
; Waveshare ESP32-S3-Touch-LCD-3.5  (transition target — UNVERIFIED)
; ---------------------------------------------------------------------------
[env:esp32-s3-lcd35]
board = esp32-s3-devkitc-1
; The mirror of the C6's lib_ignore above: this board uses the hardware SDMMC
; host, so the software-SPI SdFat stack is dead weight here.
lib_ignore = SdFat
; ESP32-S3-WROOM-1 N16R8: 16 MB quad flash + 8 MB OCTAL PSRAM, hence qio_opi
; (quad I/O flash, octal PSRAM). Getting this wrong does not fail the build —
; it fails at runtime with PSRAM absent, so if `[psram] 8 MB` is missing from
; the boot log, suspect this line first.
board_build.arduino.memory_type = qio_opi
; If PSRAM does not come up on real hardware, this pair is the first suspect:
; Waveshare's own ESP-IDF build ends up flashing DIO (octal PSRAM crowds the
; QIO flash pins on some module builds) even though their Arduino config says
; qio. Try board_build.flash_mode = dio here before doubting the wiring.
board_upload.flash_size = 16MB
board_build.f_cpu = 240000000L
build_flags =
    ${env.build_flags}
    -D BOARD_S3_LCD35
    ; 8 MB of PSRAM changes the display strategy completely: LVGL gets full
    ; double buffers instead of the C6's 1/7-frame sliver, and NimBLE no longer
    ; has to fight the UI for contiguous internal heap. PSRAM itself is switched
    ; on by the qio_opi memory_type above (it selects a prebuilt lib variant with
    ; CONFIG_SPIRAM=y) — this flag only tells OUR code it may use it.
    -D BOARD_HAS_PSRAM=1
    ; The S3 HAS an SDMMC host, and Waveshare wires the TF slot to it (CLK/CMD/D0
    ; only — no D3, so SPI mode is not available). sd_card.cpp therefore uses the
    ; Arduino SD_MMC driver on this board instead of the C6's bit-banged SPI, at
    ; roughly a hundred times the throughput.
